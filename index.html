<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <meta name="description" content="Literally my time right now.">
  <title>mytime — Literally my time right now</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0f;
      --fg: #f2f3f7;
      --muted: #858a9a;
      --line: rgba(255,255,255,.12);
      --panel: rgba(255,255,255,.035);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(97, 104, 145, .13), transparent 48%),
        var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page {
      width: min(100%, 980px);
      text-align: center;
      animation: appear .9s ease both;
    }
    .eyebrow {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .clock {
      margin: 0;
      font-size: clamp(3.5rem, 12vw, 8.8rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 0 42px rgba(255,255,255,.055);
    }
    .date {
      margin: 26px 0 0;
      color: #a8acba;
      font-size: clamp(.85rem, 2.2vw, 1rem);
      letter-spacing: .11em;
    }
    .caption {
      margin: 48px 0 0;
      color: #d6d8e0;
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      font-weight: 400;
      letter-spacing: .025em;
    }
    .timezone {
      margin: 12px 0 0;
      color: #686d7c;
      font-size: .75rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .music-control {
      position: fixed;
      top: 22px;
      right: 24px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #a8acba;
      font-size: .7rem;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
      user-select: none;
    }
    .music-switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex: 0 0 auto;
    }
    .music-switch input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
    .switch-track {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      background: rgba(255,255,255,.09);
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease;
    }
    .switch-track::after {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #8c91a0;
      content: "";
      transition: transform .2s ease, background .2s ease;
    }
    .music-switch input:checked + .switch-track {
      border-color: rgba(181,190,255,.55);
      background: rgba(126,139,230,.34);
    }
    .music-switch input:checked + .switch-track::after {
      transform: translateX(16px);
      background: #e4e7ff;
    }
    .music-switch input:focus-visible + .switch-track {
      outline: 2px solid #aab4ff;
      outline-offset: 4px;
    }
    .music-switch input:disabled + .switch-track {
      cursor: not-allowed;
      opacity: .35;
    }
    .music-hint {
      position: fixed;
      top: 50px;
      right: 24px;
      color: #686d7c;
      font-size: .68rem;
      letter-spacing: .02em;
    }
    .music-hint[hidden] { display: none; }
    .footer {
      position: fixed;
      bottom: 18px;
      left: 16px;
      right: 16px;
      color: #4f5360;
      font-size: .7rem;
      letter-spacing: .08em;
      text-align: center;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 420px) {
      body { padding: 20px; }
      .eyebrow { margin-bottom: 24px; letter-spacing: .2em; }
      .caption { margin-top: 38px; }
      .music-control { top: 18px; right: 18px; }
      .music-hint { top: 44px; right: 18px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="music-control">
    <span id="musicLabel">Music</span>
    <label class="music-switch" title="Bật hoặc tắt nhạc nền">
      <input id="musicToggle" type="checkbox" role="switch" aria-label="Music" checked>
      <span class="switch-track" aria-hidden="true"></span>
    </label>
  </div>
  <p class="music-hint" id="musicHint" aria-live="polite" hidden>Chạm để bật nhạc</p>

  <main class="page">
    <p class="eyebrow">LOCAL TIME · VIETNAM</p>
    <h1 class="clock" id="clock" aria-label="Giờ hiện tại tại Việt Nam">--:--:--</h1>
    <p class="date" id="date">Loading date…</p>
    <p class="caption">Literally my time right now.</p>
    <p class="timezone">Asia / Ho Chi Minh · UTC+7</p>
    <audio id="backgroundMusic" src="music.mp3" loop preload="auto"></audio>
  </main>
  <div class="footer">JUST HERE, JUST NOW.</div>

  <script>
    (() => {
      const timezone = 'Asia/Ho_Chi_Minh';
      const clock = document.getElementById('clock');
      const date = document.getElementById('date');
      const music = document.getElementById('backgroundMusic');
      const musicToggle = document.getElementById('musicToggle');
      const musicHint = document.getElementById('musicHint');
      let musicAvailable = true;

      // The toggle represents the user's desired setting, not whether autoplay
      // was permitted. Keep it ON by default even when the browser blocks autoplay.
      musicToggle.checked = true;

      const timeFormatter = new Intl.DateTimeFormat('en-GB', {
        timeZone: timezone,
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hourCycle: 'h23'
      });
      const dateFormatter = new Intl.DateTimeFormat('en-US', {
        timeZone: timezone,
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });

      function updateClock() {
        const now = new Date();
        clock.textContent = timeFormatter.format(now);
        date.textContent = dateFormatter.format(now);
      }
      updateClock();
      setInterval(updateClock, 250);

      music.addEventListener('error', () => {
        // Missing music.mp3 must not break the clock or force the toggle OFF.
        musicAvailable = false;
        music.pause();
        musicHint.textContent = 'Không tìm thấy music.mp3';
        musicHint.hidden = false;
      });

      async function turnMusicOn() {
        if (!musicAvailable) {
          musicHint.textContent = 'Không tìm thấy music.mp3';
          musicHint.hidden = false;
          return;
        }
        try {
          await music.play();
          musicHint.hidden = true;
        } catch (_) {
          // Autoplay may be blocked by the browser. Keep the switch ON and retry
          // after a real user interaction instead of making it look OFF.
          musicHint.textContent = 'Chạm vào màn hình để phát nhạc';
          musicHint.hidden = false;
        }
      }

      musicToggle.addEventListener('change', async () => {
        if (!musicToggle.checked) {
          music.pause();
          musicHint.hidden = true;
          return;
        }
        await turnMusicOn();
      });

      // Many browsers require a user gesture before audio can start. A tap
      // anywhere outside the switch retries playback without changing the switch.
      document.addEventListener('pointerdown', (event) => {
        if (event.target.closest('.music-control')) return;
        if (musicToggle.checked && musicAvailable && music.paused) {
          turnMusicOn();
        }
      });

      // Try autoplay on page load. Failure is handled above and is harmless.
      turnMusicOn();
    })();
  </script>
</body>
</html>

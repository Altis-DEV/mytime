<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090a0f">
  <meta name="description" content="Literally my time right now.">
  <title>mytime — Literally my time right now</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090a0f;
      --fg: #f2f3f7;
      --muted: #858a9a;
      --line: rgba(255,255,255,.12);
      --panel: rgba(255,255,255,.035);
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 24px;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(97, 104, 145, .13), transparent 48%),
        var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page {
      width: min(100%, 980px);
      text-align: center;
      animation: appear .9s ease both;
    }
    .eyebrow {
      margin: 0 0 28px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .28em;
      text-transform: uppercase;
    }
    .clock {
      margin: 0;
      font-size: clamp(3.5rem, 12vw, 8.8rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -.075em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      text-shadow: 0 0 42px rgba(255,255,255,.055);
    }
    .date {
      margin: 26px 0 0;
      color: #a8acba;
      font-size: clamp(.85rem, 2.2vw, 1rem);
      letter-spacing: .11em;
    }
    .caption {
      margin: 48px 0 0;
      color: #d6d8e0;
      font-size: clamp(1rem, 2.8vw, 1.35rem);
      font-weight: 400;
      letter-spacing: .025em;
    }
    .timezone {
      margin: 12px 0 0;
      color: #686d7c;
      font-size: .75rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .sound-control {
      margin-top: 44px;
      min-height: 40px;
      padding: 10px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: #c6c9d3;
      font: inherit;
      font-size: .8rem;
      letter-spacing: .04em;
      cursor: pointer;
      transition: background .2s ease, border-color .2s ease, color .2s ease;
    }
    .sound-control:hover { background: rgba(255,255,255,.075); border-color: rgba(255,255,255,.25); color: white; }
    .sound-control:focus-visible { outline: 2px solid #aab4ff; outline-offset: 4px; }
    .sound-control[hidden] { display: none; }
    .footer {
      position: fixed;
      bottom: 18px;
      left: 16px;
      right: 16px;
      color: #4f5360;
      font-size: .7rem;
      letter-spacing: .08em;
      text-align: center;
    }
    @keyframes appear { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 420px) {
      .eyebrow { margin-bottom: 24px; letter-spacing: .2em; }
      .caption { margin-top: 38px; }
      .sound-control { margin-top: 34px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <p class="eyebrow">LOCAL TIME · VIETNAM</p>
    <h1 class="clock" id="clock" aria-label="Giờ hiện tại tại Việt Nam">--:--:--</h1>
    <p class="date" id="date">Loading date…</p>
    <p class="caption">Literally my time right now.</p>
    <p class="timezone">Asia / Ho Chi Minh · UTC+7</p>
    <button class="sound-control" id="soundButton" type="button" hidden>♪ Bật nhạc nền</button>
    <audio id="backgroundMusic" src="music.mp3" loop preload="auto"></audio>
  </main>
  <div class="footer">JUST HERE, JUST NOW.</div>

  <script>
    (() => {
      const timezone = 'Asia/Ho_Chi_Minh';
      const clock = document.getElementById('clock');
      const date = document.getElementById('date');
      const music = document.getElementById('backgroundMusic');
      const soundButton = document.getElementById('soundButton');
      let musicAvailable = true;

      const timeFormatter = new Intl.DateTimeFormat('en-GB', {
        timeZone: timezone,
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hourCycle: 'h23'
      });
      const dateFormatter = new Intl.DateTimeFormat('en-US', {
        timeZone: timezone,
        weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
      });

      function updateClock() {
        const now = new Date();
        clock.textContent = timeFormatter.format(now);
        date.textContent = dateFormatter.format(now);
      }
      updateClock();
      setInterval(updateClock, 250);

      // If music.mp3 is missing, keep the clock working silently.
      music.addEventListener('error', () => {
        musicAvailable = false;
        soundButton.hidden = true;
      });

      // Autoplay may be blocked by the browser; offer a manual button instead.
      const autoplay = music.play();
      if (autoplay && typeof autoplay.then === 'function') {
        autoplay.then(() => {
          soundButton.hidden = true;
        }).catch(() => {
          soundButton.hidden = false;
          soundButton.textContent = '♪ Bật nhạc nền';
        });
      }

      soundButton.addEventListener('click', async () => {
        if (!musicAvailable) return;
        try {
          if (music.paused) {
            await music.play();
            soundButton.textContent = '♫ Nhạc nền đang bật';
          } else {
            music.pause();
            soundButton.textContent = '♪ Bật nhạc nền';
          }
        } catch (_) {
          // A missing/unsupported file should never break the clock.
          soundButton.hidden = true;
        }
      });
    })();
  </script>
</body>
</html>
